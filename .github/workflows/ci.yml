name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build (warnings are errors)
        run: dotnet build ExolvraTestApp.csproj -c Release
      - name: Slow gate (force park-on-CI for the #963 landing test)
        run: sleep 90
